name: Test su più anni

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Anni di storico (1-8)'
        default: '3'
        required: true
      param:
        description: 'Parametro da confrontare (vuoto = solo le regole attuali)'
        default: ''
        required: false
      values:
        description: 'Valori separati da virgola'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: trader-sim
  cancel-in-progress: false

jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test della strategia su più anni
        env:
          YEARS: ${{ inputs.years }}
          PARAM: ${{ inputs.param }}
          VALUES: ${{ inputs.values }}
        run: node engine/storico.mjs
      - name: Salvataggio dei risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Test su più anni $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
