name: Simulatore (ogni 4 ore)

on:
  schedule:
    - cron: '7 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trader-sim
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Elaborazione dell'ultima candela
        run: node engine/run.mjs
      - name: Salvataggio dei dati per il cruscotto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aggiornamento simulazione $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
