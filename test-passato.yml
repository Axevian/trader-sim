name: Test sul passato

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: write

concurrency:
  group: trader-sim
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test della strategia sullo storico
        run: node engine/backtest.mjs
      - name: Salvataggio dei risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Test sul passato $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash || true
          git push
